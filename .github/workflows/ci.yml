name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --fail-on-warn --validate --file /tmp/schema.yaml

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    # Builds the image and checks that the compose stack (prod settings,
    # gunicorn, Postgres, Redis) becomes healthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for the smoke test
        run: |
          cp .env.example .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=ci-$(openssl rand -hex 32)|" .env
          sed -i "s|^DJANGO_SETTINGS_MODULE=.*|DJANGO_SETTINGS_MODULE=config.settings.prod|" .env

      - name: Start the stack and wait for healthchecks
        run: docker compose up -d --build --wait --wait-timeout 240 web

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health/
          curl -fsS http://localhost:8000/api/products/ > /dev/null
          curl -fsS http://localhost:8000/api/schema/ > /dev/null

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
