# Full stack:            docker compose up -d --build
# Only DB + Redis (dev):  docker compose up -d db redis   (then run Django locally)
#
# Reads .env (copy .env.example). The values below override the ones that must
# point at the other containers (database host, Redis URL).
x-app: &app
  build: .
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE_DOCKER:-config.settings.prod}
    DB_ENGINE: django.db.backends.postgresql
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    # Local docker runs over plain http. Behind an HTTPS proxy set
    # DOCKER_SECURE_SSL_REDIRECT=True (separate name so the SECURE_SSL_REDIRECT
    # value in .env, meant for real deployments, does not leak in here).
    SECURE_SSL_REDIRECT: ${DOCKER_SECURE_SSL_REDIRECT:-False}
    SERVE_MEDIA: ${DOCKER_SERVE_MEDIA:-True}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-shopdb}
      POSTGRES_USER: ${DB_USER:-shopuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      # Exposed on localhost so Django can run outside Docker during development.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<version>/.
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    healthcheck:
      disable: true
    restart: "no"

  web:
    <<: *app
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: celery -A config worker -l info
    healthcheck:
      disable: true
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:
  static:
