# docker compose up --build
# Reads .env (copy .env.example). Values below override the ones that must point
# at the other containers (database host, Redis URL).
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
  DB_ENGINE: django.db.backends.postgresql
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-shopdb}
  DB_USER: ${DB_USER:-shopuser}
  DB_PASSWORD: ${DB_PASSWORD:-shoppass}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  # Local docker runs over plain http; set to True behind an HTTPS proxy.
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  SERVE_MEDIA: ${SERVE_MEDIA:-True}

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-shopdb}
      POSTGRES_USER: ${DB_USER:-shopuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shoppass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - .env
    environment:
      <<: *app-env
    command: celery -A config worker -l info
    healthcheck:
      disable: true
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file:
      - .env
    environment:
      <<: *app-env
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media:
  static:
