openapi: 3.0.3
info:
  title: Custom Shop Backend
  version: 1.0.0
  description: "\nراهنمای استفاده از API — Custom Shop (کاستومی)\n\n1) احراز هویت\n\
    - POST /api/accounts/register/ → ثبت‌نام\n- POST /api/accounts/login/ {\"identifier\"\
    : \"<email|username|phone>\", \"password\": \"...\"} → access / refresh\n- POST\
    \ /api/accounts/token/refresh/ {\"refresh\": \"...\"}\n- POST /api/accounts/request-otp/\
    \ {\"target\": \"<email|phone>\", \"purpose\": \"login\"}\n- POST /api/accounts/verify-otp/\
    \ {\"target\": \"...\", \"code\": \"123456\", \"purpose\": \"login\"} → JWT\n\
    - در Swagger روی Authorize بزنید و مقدار «Bearer <access>» را وارد کنید.\n\n2)\
    \ کاربر\n- /api/myuser/ مشاهده، ویرایش و غیرفعال‌سازی حساب + سفارش‌های اخیر\n\
    - /api/myuser/address/ مدیریت آدرس‌ها\n- /api/myuser/register_as_seller/ تبدیل\
    \ به فروشنده و ساخت فروشگاه\n\n3) فروشگاه و کالا\n- /api/categories/ ، /api/products/\
    \ (search, filter, ordering, pagination) ، /api/stores/\n- /api/products/{id}/review_create/\
    \ و /api/stores/{id}/review_create/\n- /api/mystore/ (فروشنده): فروشگاه، آدرس‌ها،\
    \ کالاها، سفارش‌ها و تغییر وضعیت آیتم سفارش\n\n4) خرید\n- /api/mycart/ ، /api/mycart/add_to_cart/{store_item_id}/\
    \ ، /api/mycart/items/\n- POST /api/orders/checkout/ {\"address\": \"<id>\"} →\
    \ سفارش + payment_url\n- /api/myorders/ تاریخچه سفارش‌ها و لغو سفارش در وضعیت\
    \ PENDING\n- POST /api/payments/{order_id}/start/ → startpay_url زرین‌پال\n- GET\
    \ /api/payments/verify/?Authority=...&Status=OK → تایید پرداخت (ایدمپوتنت)\n\n\
    5) مدیریت (staff)\n- /api/admin/users/ ، /api/admin/categories/ ، /api/orders/\
    \ ، /api/payments/\n\nوضعیت سفارش: PENDING → PAID یا PENDING → CANCELLED (لغو،\
    \ موجودی را فقط یک‌بار برمی‌گرداند).\nوضعیت آیتم سفارش: PENDING → SHIPPED → DELIVERED\
    \ یا PENDING → CANCELLED.\nهمه لیست‌ها صفحه‌بندی دارند: ?page=2&page_size=50\n\
    \    "
  termsOfService: https://example.com/terms
  contact:
    name: Support
    url: https://example.com/support
    email: support@example.com
  license:
    name: Proprietary
    url: https://example.com/license
