  /api/payments/verify/:
    get:
      operationId: payments_verify_retrieve
      description: 'Gateway callback. Verifies the payment and moves the order PENDING
        -> PAID (or PENDING -> CANCELLED when Status != OK). Idempotent: calling it
        again for a paid order returns the same success response.'
      parameters:
      - in: query
        name: Authority
        schema:
          type: string
        description: Payment authority code from the gateway
        required: true
      - in: query
        name: Status
        schema:
          type: string
        description: Callback status from the gateway (OK or NOK)
        required: true
        examples:
          OK:
            value: OK
      tags:
      - Payments
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
          description: ''
