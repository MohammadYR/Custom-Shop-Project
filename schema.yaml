          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyResponse'
          description: OK. For login purpose returns JWT tokens.
        '400':
          description: Invalid OTP code or too many attempts
        '403':
          description: Account is disabled
        '404':
          description: User not found (login purpose)
        '429':
