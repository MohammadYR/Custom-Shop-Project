components:
  schemas:
    AddToCartRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          default: 1
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        line1:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        is_default:
          type: boolean
        purpose:
          type: string
          maxLength: 20
      required:
      - city
      - id
      - line1
      - postal_code
    AddressCreateUpdate:
      type: object
      description: |-
        Setting is_default=True automatically un-sets the previous default
        (see accounts.signals.ensure_single_default_address).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        line1:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        is_default:
          type: boolean
        purpose:
          type: string
          maxLength: 20
      required:
      - city
      - id
      - line1
      - postal_code
    AddressCreateUpdateRequest:
      type: object
      description: |-
        Setting is_default=True automatically un-sets the previous default
        (see accounts.signals.ensure_single_default_address).
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        is_default:
          type: boolean
        purpose:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - city
      - line1
      - postal_code
    AddressRequest:
      type: object
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        is_default:
          type: boolean
        purpose:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - city
      - line1
      - postal_code
    AdminUser:
      type: object
      description: Staff-only user management.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_seller:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - id
      - last_login
      - username
    AdminUserRequest:
      type: object
      description: Staff-only user management.
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_seller:
          type: boolean
      required:
      - email
      - username
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_items:
          type: integer
          readOnly: true
        total_original_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Amount to pay, after discounts
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - total_discount
      - total_items
      - total_original_price
      - total_price
      - updated_at
      - user
    CartAddItemRequest:
      type: object
      properties:
        store_item:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - store_item
    CartItem:
      type: object
      description: A cart line. ``cart`` is always the requesting user's cart (read-only).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cart:
          type: string
          format: uuid
          readOnly: true
        store_item:
          type: string
          format: uuid
        store_item_detail:
          allOf:
          - $ref: '#/components/schemas/StoreItem'
          readOnly: true
        quantity:
          type: integer
          minimum: 1
          default: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        original_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        subtotal:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cart
      - created_at
      - discount
      - id
      - original_price
      - store_item
      - store_item_detail
      - subtotal
      - unit_price
      - updated_at
    CartItemRequest:
      type: object
      description: A cart line. ``cart`` is always the requesting user's cart (read-only).
      properties:
        store_item:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - store_item
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          readOnly: true
          pattern: ^[-\w]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - new_password
      - old_password
    CheckoutRequest:
      type: object
      properties:
        address:
          type: string
          format: uuid
          description: Address id; defaults to your default address
    LoginRequestRequest:
      type: object
      properties:
        identifier:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - identifier
      - password
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    MyStoreItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        store:
          type: string
          format: uuid
          readOnly: true
        store_name:
          type: string
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        variant:
          type: string
          format: uuid
        variant_detail:
          allOf:
          - $ref: '#/components/schemas/ProductVariant'
          readOnly: true
        sku:
          type: string
          description: A unique identifier for this product in the store
          maxLength: 64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_percent:
          type: integer
          maximum: 100
          minimum: 0
        final_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        discount_price:
          type: string
          nullable: true
          readOnly: true
          description: final_price when a discount applies, else null
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - discount_price
      - final_price
      - id
      - price
      - product
      - sku
      - store
      - store_name
      - updated_at
      - variant
      - variant_detail
    MyStoreItemRequest:
      type: object
      properties:
        variant:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
          description: A unique identifier for this product in the store
          maxLength: 64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_percent:
          type: integer
          maximum: 100
          minimum: 0
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
      required:
      - price
      - sku
      - variant
    MyUser:
      type: object
      description: 'GET/PATCH /api/myuser/: profile plus the latest orders (full history
        at /api/myorders/).'
      properties:
        id:
          type: integer
          readOnly: true
        username:
